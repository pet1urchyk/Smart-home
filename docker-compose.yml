services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    environment:
      - DATABASE_URL=postgresql+asyncpg://sensor_user:sensor_pass@db:5432/sensors_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sensor_user
      POSTGRES_PASSWORD: sensor_pass
      POSTGRES_DB: sensors_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_user -d sensors_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  subscriber:
    build:
      context: .
      dockerfile: Dockerfile.subscriber
    environment:
      - MQTT_HOST=192.168.8.171
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    profiles: ["test"]  
    build:
      context: .
      dockerfile: Dockerfile.publisher
    environment:
      - MQTT_HOST=192.168.8.171
      - SENSOR_ID=2
    restart: unless-stopped
      
  grafana:
    image: grafana/grafana:latest

    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  analize_temps:
    build:
      context: .
      dockerfile: Dockerfile.ml-ai
    environment:
      - DATABASE_URL=postgresql+asyncpg://sensor_user:sensor_pass@db:5432/sensors_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_UV_AUTO_DETECT=false
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes: 
      - .:/app:z
    restart: unless-stopped

  predict_temps:
    build:
      context: .
      dockerfile: Dockerfile.ml-predict
    environment:
      - DATABASE_URL=postgresql+asyncpg://sensor_user:sensor_pass@db:5432/sensors_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_UV_AUTO_DETECT=false
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes: 
      - .:/app:z
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////var/lib/mlflow/mlflow.db
        --default-artifact-root mlflow-artifacts:/
        --serve-artifacts
        --artifacts-destination /var/lib/mlflow/artifacts
        --allowed-hosts *
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/var/lib/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped


volumes:
  postgres_data:
  grafana_data:
  mlflow_data: